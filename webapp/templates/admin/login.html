{% extends "base.html" %}
{% block title %}Administrator Login | LeafLens{% endblock %}
{% block content %}
<section class="auth-panel" aria-labelledby="page-heading">
  <header class="form-heading">
    <p class="form-eyebrow">ADMIN PORTAL</p>
    <h2 id="page-heading">Administrator Login</h2>
    <span class="admin-login-label">Admin</span>
  </header>

  <form class="auth-form" method="POST" action="/admin/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="form-field">
      <label for="email">Email</label>
      <div class="input-wrap has-leading-icon">
        <svg class="field-icon person-field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20c.7-4 3.2-6 7.5-6s6.8 2 7.5 6"></path></svg>
        <input id="email" name="email" type="email" placeholder="Enter admin email" value="{{ form_data.get('email', '') if form_data else request.form.get('email', '') }}" autocomplete="email" required />
      </div>
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <div class="input-wrap has-leading-icon">
        <svg class="field-icon lock-field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="1"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
      </div>
    </div>

    <button class="submit-button" type="submit">LOGIN</button>
  </form>
</section>
{% endblock %}
