{% extends "base.html" %} {% block title %}Reset Password | Plant Disease
Detection System{% endblock %} {% block content %}
<section class="auth-panel recovery-panel" aria-labelledby="page-heading">
  <div class="recovery-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <rect x="4" y="10" width="16" height="11" rx="2"></rect>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      <circle class="recovery-icon-detail" cx="12" cy="15" r="1"></circle>
      <path d="M12 16v2"></path>
    </svg>
  </div>

  <header class="form-heading">
    <p class="form-eyebrow">SECURE YOUR ACCOUNT</p>
    <h2 id="page-heading">Reset password</h2>
    <p>Choose a new password for your account. Use at least 8 characters.</p>
  </header>

  <form class="auth-form" method="POST" action="">
    <div class="form-field">
      <label for="password">New password</label>
      <div class="input-wrap has-leading-icon">
        <svg
          class="field-icon lock-field-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect x="5" y="10" width="14" height="11" rx="1"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter new password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
        />
        <button
          class="password-toggle"
          type="button"
          data-password-toggle
          aria-controls="password"
          aria-label="Show password"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        </button>
      </div>
    </div>

    <div class="form-field">
      <label for="confirm_password">Confirm new password</label>
      <div class="input-wrap has-leading-icon">
        <svg
          class="field-icon lock-field-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect x="5" y="10" width="14" height="11" rx="1"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
        <input
          id="confirm_password"
          name="confirm_password"
          type="password"
          placeholder="Re-enter new password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
        />
        <button
          class="password-toggle"
          type="button"
          data-password-toggle
          aria-controls="confirm_password"
          aria-label="Show password"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        </button>
      </div>
    </div>

    <button class="submit-button" type="submit">Update password</button>
  </form>

  <nav class="auth-links" aria-label="Account links">
    <a class="recovery-back-link" href="/login">
      <span aria-hidden="true">&larr;</span> Back to login
    </a>
  </nav>
</section>
{% endblock %}
